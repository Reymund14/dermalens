# Render Blueprint for DermaLens (free tier), from the repository root.
# Before the first deploy, create a Supabase project: PostgreSQL for the data
# and a private Storage bucket named dermalens for photos and PDFs. Use the
# session pooler URL with the psycopg scheme, e.g.
#   postgresql+psycopg://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
# Keep the region the same as your Supabase region. Render prompts for the
# sync:false values when the blueprint is applied. See dermalens/DEPLOY.md.
#
# The API image runs services/api/start.sh, which upgrades the schema and seeds
# reference data on every boot. Inference uses the in-process stub classifier;
# no Render disk is needed because files live in Supabase Storage. Free web
# services sleep after inactivity. This is still a demo deployment because
# the model is a stub.

services:
  - type: web
    runtime: docker
    name: dermalens-api
    region: singapore
    plan: free
    dockerfilePath: ./dermalens/services/api/Dockerfile
    dockerContext: ./dermalens
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DERMALENS_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Supabase session pooler URL, with postgresql+psycopg:// scheme
      - key: SUPABASE_URL
        sync: false # https://<project-ref>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # service role key; keep secret
      - key: SUPABASE_STORAGE_BUCKET
        value: dermalens # private bucket; create it in Supabase Storage
      - key: JWT_SECRET
        sync: false # random 32+ byte string
      - key: DATA_KEY
        sync: false # Fernet key: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: ADMIN_EMAIL
        sync: false # first admin; start.sh creates or resets it
      - key: ADMIN_PASSWORD
        sync: false # 10-128 characters
      - key: ADMIN_NAME
        sync: false
      - key: SEED_DEV_ACCOUNTS
        value: "0"
      - key: INFERENCE_URL
        value: "" # empty = in-process stub classifier
      - key: PUBLIC_BASE_URL
        fromService:
          name: dermalens-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_WEB_URL
        sync: false # https origin of dermalens-app; used in emailed links
      - key: CORS_ORIGINS
        sync: false # both web origins, comma-separated
      - key: CLINIC_CONTACT
        sync: false # address, phone and booking link printed on the PDF
      - key: SMTP_HOST
        sync: false # empty = emails are written to the API log
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLINIC_NOTIFY_EMAIL
        sync: false # optional no-details email when a patient shares a summary

  - type: web
    runtime: static
    name: dermalens-web # Expo web build of the phone app
    buildCommand: cd dermalens/apps/mobile && npm ci && npx expo export --platform web --clear --output-dir dist
    staticPublishPath: ./dermalens/apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_API_URL
        sync: false # the API's HTTPS address

  - type: web
    runtime: static
    name: dermalens-app # desktop web app for all roles (apps/web)
    buildCommand: cd dermalens/apps/web && npm ci && npm run build
    staticPublishPath: ./dermalens/apps/web/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false # the API's HTTPS address
